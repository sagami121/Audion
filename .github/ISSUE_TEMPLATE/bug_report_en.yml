name: Bug Report
description: Report a bug in Audion
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Clear details make it much easier to investigate.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What bug are you experiencing?
      placeholder: 'Example: Lyrics shift out of position when lyrics display is enabled during playback.'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Please list the steps needed to reproduce the issue.
      placeholder: |
        1. Launch the app
        2. Add an audio file
        3. Enable lyrics display in settings
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Audion Version
      placeholder: 'Example: 1.0.7'

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or Logs
      description: Attach screenshots, videos, or logs if available.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context that may help.
