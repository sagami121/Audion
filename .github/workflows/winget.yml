name: Winget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to submit. Defaults to the latest Changelog.txt entry.
        required: false
      package_id:
        description: WinGet package identifier.
        required: false
        default: sagami121.Audion

concurrency:
  group: winget-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  submit:
    name: Submit WinGet Update
    if: github.event_name != 'release' || github.event.release.prerelease != true
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WINGET_TOKEN_CONFIGURED: ${{ secrets.WINGET_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip without WinGet token
        if: env.WINGET_TOKEN_CONFIGURED != 'true'
        run: echo "WINGET_TOKEN is not configured. Skipping WinGet submission."

      - name: Read changelog release
        if: env.WINGET_TOKEN_CONFIGURED == 'true'
        id: changelog
        run: node scripts/release-info.mjs

      - name: Resolve release asset
        if: env.WINGET_TOKEN_CONFIGURED == 'true'
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            if ("${{ github.event_name }}" -eq "release") {
              $version = "${{ github.event.release.tag_name }}".TrimStart("v")
            } else {
              $version = "${{ steps.changelog.outputs.version }}"
            }
          }
          $tag = $version
          $assetJson = gh release view $tag --json assets 2>$null
          if (-not $assetJson) {
            $tag = "v$version"
            $assetJson = gh release view $tag --json assets
          }
          $asset = ($assetJson | ConvertFrom-Json).assets |
            Where-Object { $_.name -like "*.exe" } |
            Select-Object -First 1
          if (-not $asset) {
            throw "No EXE asset found in release $tag."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "installer_url=$($asset.url)" >> $env:GITHUB_OUTPUT

      - name: Download wingetcreate
        if: env.WINGET_TOKEN_CONFIGURED == 'true'
        shell: pwsh
        run: Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit WinGet PR
        if: env.WINGET_TOKEN_CONFIGURED == 'true'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) {
            throw "Missing WINGET_TOKEN secret."
          }
          $packageId = "${{ github.event.inputs.package_id }}"
          if ([string]::IsNullOrWhiteSpace($packageId)) {
            $packageId = "sagami121.Audion"
          }
          .\wingetcreate.exe update $packageId `
            -v ${{ steps.release.outputs.version }} `
            -u "${{ steps.release.outputs.installer_url }}" `
            -t $env:WINGET_TOKEN `
            --submit
