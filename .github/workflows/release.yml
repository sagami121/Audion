name: Release

on:
  push:
    branches: [main]
    paths:
      - Changelog.txt
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide release trigger
        id: release_gate
        shell: pwsh
        run: |
          $shouldRelease = "false"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -or "${{ github.event_name }}" -eq "push") {
            $shouldRelease = "true"
          } elseif ("${{ github.event_name }}" -eq "workflow_run" -and "${{ github.event.workflow_run.conclusion }}" -eq "success") {
            $changedFiles = git diff-tree --no-commit-id --name-only -r "${{ github.event.workflow_run.head_sha }}"
            if ($changedFiles -contains "Changelog.txt") {
              $shouldRelease = "true"
            }
          }
          "should_release=$shouldRelease" >> $env:GITHUB_OUTPUT

      - name: Stop when release is not needed
        if: steps.release_gate.outputs.should_release != 'true'
        run: echo "Skipping release because this run was not triggered by a Changelog.txt release change."

      - name: Setup Node.js
        if: steps.release_gate.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        if: steps.release_gate.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        if: steps.release_gate.outputs.should_release == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        if: steps.release_gate.outputs.should_release == 'true'
        run: npm ci

      - name: Read changelog release
        if: steps.release_gate.outputs.should_release == 'true'
        id: release_info
        run: node scripts/release-info.mjs --out release-notes.md

      - name: Validate changelog version
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $releaseVersion = "${{ steps.release_info.outputs.version }}"
          $packageParts = $packageVersion.Split(".") | ForEach-Object { [int]$_ }
          $releaseParts = $releaseVersion.Split(".") | ForEach-Object { [int]$_ }
          for ($i = 0; $i -lt [Math]::Max($packageParts.Count, $releaseParts.Count); $i++) {
            $packagePart = if ($i -lt $packageParts.Count) { $packageParts[$i] } else { 0 }
            $releasePart = if ($i -lt $releaseParts.Count) { $releaseParts[$i] } else { 0 }
            if ($releasePart -lt $packagePart) {
              throw "Latest Changelog.txt version ($releaseVersion) is older than package.json version ($packageVersion). Add a new Changelog.txt entry before releasing."
            }
            if ($releasePart -gt $packagePart) {
              break
            }
          }

      - name: Check existing tag
        if: steps.release_gate.outputs.should_release == 'true'
        id: tag_state
        shell: pwsh
        run: |
          git fetch --tags
          $tagExists = "false"
          if (git rev-parse --verify "refs/tags/${{ steps.release_info.outputs.tag }}" 2>$null) {
            $tagExists = "true"
            Write-Host "Tag ${{ steps.release_info.outputs.tag }} already exists. Reusing it for this release run."
          }
          "tag_exists=$tagExists" >> $env:GITHUB_OUTPUT

      - name: Bump project version
        if: steps.release_gate.outputs.should_release == 'true'
        run: npm run bump ${{ steps.release_info.outputs.version }}

      - name: Update Cargo.lock
        if: steps.release_gate.outputs.should_release == 'true'
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Check formatting
        if: steps.release_gate.outputs.should_release == 'true'
        run: npm run format:check

      - name: Lint frontend
        if: steps.release_gate.outputs.should_release == 'true'
        run: npm run lint

      - name: Build frontend
        if: steps.release_gate.outputs.should_release == 'true'
        run: npm run build

      - name: Build Tauri app
        if: steps.release_gate.outputs.should_release == 'true'
        run: npm run tauri build

      - name: Generate installer checksums
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in ".msi", ".exe" }
          if (-not $artifacts) {
            throw "No installer artifacts found."
          }
          foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($artifact.Name)" | Set-Content "$($artifact.FullName).sha256" -Encoding ascii
          }

      - name: Commit version bump and tag
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: release ${{ steps.release_info.outputs.tag }}"
          }
          if ("${{ steps.tag_state.outputs.tag_exists }}" -ne "true") {
            git tag ${{ steps.release_info.outputs.tag }}
          }
          git push origin HEAD:main
          if ("${{ steps.tag_state.outputs.tag_exists }}" -ne "true") {
            git push origin ${{ steps.release_info.outputs.tag }}
          }

      - name: Publish GitHub Release
        if: steps.release_gate.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Audion ${{ steps.release_info.outputs.version }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.sha256
          fail_on_unmatched_files: true

      - name: Dispatch WinGet workflow
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run winget.yml --ref main -f version=${{ steps.release_info.outputs.version }}
